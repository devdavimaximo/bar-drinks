<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Renan Open Drink · Open bar & barman no RJ</title>
    <meta name="description" content="Renan Open Drink: open bar e estação de drinks com frutas frescas para aniversários, churrascos, festas juninas e casamentos no Rio de Janeiro." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1a1009" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Renan Open Drink · Open bar & barman no RJ" />
    <meta property="og:description" content="O bar é onde a festa acontece." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <!--
      Preloader: HTML + CSS inline, pinta no primeiro quadro, antes de qualquer JS.
      A entrada é CSS puro; Preloader.tsx só adiciona .is-out quando o drink compilou.
      Tempos e curvas copiam a linha do tempo GSAP que existia antes.
    -->
    <style>
      :root {
        --night: #1a1009;
        --bone: #efe7da;
        --bone-2: rgba(239, 231, 218, 0.72);
        --brass-2: #d6b87f;
        --rose-2: #ecd08a;
        --serif: 'Bodoni Moda Variable', 'Didot', 'Bodoni 72', 'Times New Roman', serif;
        --p2io: cubic-bezier(0.45, 0, 0.55, 1);
        --p2o: cubic-bezier(0.33, 1, 0.68, 1);
        --p3i: cubic-bezier(0.32, 0, 0.67, 0);
        --xo: cubic-bezier(0.16, 1, 0.3, 1);
        --xio: cubic-bezier(0.87, 0, 0.13, 1);
      }
      html { background: #1a1009; }
      html.is-loading, html.is-loading body { overflow: hidden; }
      .preloader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: var(--bone); }
      .preloader__curtain {
        position: absolute; inset: 0;
        background: radial-gradient(60% 50% at 50% 55%, #2e1d10, var(--night) 70%), var(--night);
        box-shadow: inset 0 -1px 0 rgba(214, 184, 127, 0.3);
      }
      .preloader__center { position: relative; display: grid; justify-items: center; gap: 24px; }
      .preloader__mark { position: relative; width: 92px; color: var(--brass-2); }
      .preloader__mono { position: relative; width: 92px; display: block; aspect-ratio: 1; }
      /* logo do prospect (prévia personalizada) no lugar da bolacha */
      .preloader__logo { display: block; width: 92px; height: 92px; padding: 12px; border-radius: 50%; background: var(--bone); object-fit: contain; opacity: 0; animation: pl-sub 1s ease 0.2s forwards; }
      .preloader .mono__ring { stroke-dasharray: 188.5; stroke-dashoffset: 188.5; animation: pl-ring 1.2s var(--p2io) 0.1s forwards; }
      /* a bebida da taça do monograma: um triângulo rosa que enche de baixo para cima */
      .preloader__fill {
        position: absolute; left: 32%; right: 32%; top: 34.5%; height: 17%;
        background: var(--rose-2); clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: 50% 100%; opacity: 0.85; transform: scaleY(0);
        animation: pl-fill 1.2s var(--p2io) 0.3s forwards;
      }
      .preloader__word { margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: 0.5em; margin-right: -0.5em; }
      .preloader__char { display: inline-block; opacity: 0; animation: pl-char 0.9s var(--xo) calc(0.5s + var(--i) * 0.05s) forwards; }
      .preloader__sub { margin: -12px 0 0; font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--bone-2); opacity: 0; animation: pl-sub 1s ease 1.1s forwards; }

      /* saída: o anel fecha, a taça termina de encher, tudo sobe e a cortina abre */
      .preloader.is-out .mono__ring { animation: pl-ring-out 0.6s var(--p2o) forwards; }
      .preloader.is-out .preloader__fill { animation: pl-fill-out 0.5s var(--p2o) forwards; }
      .preloader.is-out .preloader__mark { animation: pl-away 0.55s var(--p3i) 0.75s forwards; }
      .preloader.is-out .preloader__word { animation: pl-away 0.55s var(--p3i) 0.8s forwards; }
      .preloader.is-out .preloader__sub { opacity: 1; animation: pl-away 0.55s var(--p3i) 0.85s forwards; }
      .preloader.is-out .preloader__curtain { animation: pl-curtain 1.3s var(--xio) 1.3s forwards; }

      @keyframes pl-ring { to { stroke-dashoffset: 28.3; } }
      @keyframes pl-fill { to { transform: scaleY(0.85); } }
      @keyframes pl-char { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes pl-sub { to { opacity: 1; } }
      @keyframes pl-ring-out { from { stroke-dashoffset: 28.3; } to { stroke-dashoffset: 0; } }
      @keyframes pl-fill-out { from { transform: scaleY(0.85); } to { transform: scaleY(1); } }
      @keyframes pl-away { to { opacity: 0; transform: translateY(-14px); } }
      @keyframes pl-curtain { to { transform: translateY(-101%); } }

      @media (prefers-reduced-motion: reduce) {
        .preloader *, .preloader.is-out * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      }
    </style>
  </head>
  <body>
    <!--preloader-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
